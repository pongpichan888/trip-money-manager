<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Trip Money"><title>Trip Money Manager</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#172923;--muted:#6d7a74;--line:#e3e9e3;--green:#173f35;--mint:#dceee4;--orange:#f2b36d;--red:#b74a3e;--purple:#e9e6fa;--shadow:0 8px 28px #183e3010}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:820px;margin:auto;padding:0 15px}.top{background:var(--green);color:#fff;padding:calc(19px + env(safe-area-inset-top)) 0 21px;border-radius:0 0 25px 25px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:11px;letter-spacing:.09em;opacity:.75}.brand{font-size:23px;font-weight:850;margin-top:3px}.top p{margin:6px 0 0;color:#d6e4dc;font-size:13px}.top-actions{display:flex;gap:7px}.iconbtn{border:1px solid #ffffff40;background:#ffffff12;color:white;border-radius:12px;padding:10px}.tripbar{margin-top:17px;display:flex;gap:8px}.tripbar select{min-width:0;flex:1;background:#fff;color:var(--ink);border:0;border-radius:12px;padding:12px}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750}.btn-primary{background:var(--green);color:#fff}.btn-light{background:#eef3ef;color:var(--green)}.btn-orange{background:var(--orange);color:#3a2a18}.btn-danger{background:#fff0ed;color:var(--red)}.btn-small{padding:7px 9px;font-size:12px}.main{padding-top:17px}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#e8ede7;padding:5px;border-radius:15px;margin-bottom:15px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 2px;border-radius:11px;font-size:12px;font-weight:750}.tab.active{background:#fff;color:var(--green);box-shadow:0 2px 7px #163a2d10}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:13px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:21px;font-weight:850;margin-top:6px;overflow-wrap:anywhere}.stat-note{font-size:11px;color:var(--muted);margin-top:4px}.section{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:13px}.section h2{font-size:16px;margin:0}.section h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:12px;line-height:1.5}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:11px;min-width:0}.field label{font-size:12px;font-weight:750;color:#52635b}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fbfcfa;color:var(--ink);outline-color:#86b49b}.field textarea{min-height:64px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:8px 10px;border-radius:999px;background:#fff;font-size:12px}.chip input{accent-color:var(--green)}.person-dot{display:inline-flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:11px;background:var(--mint);color:var(--green);font-weight:850;flex-shrink:0}.rowitem{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.rowitem:last-child{border-bottom:0;padding-bottom:0}.item-main{flex:1;min-width:0}.item-title{font-weight:750;font-size:14px;overflow-wrap:anywhere}.item-sub{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.amount{font-weight:850;text-align:right;white-space:nowrap}.empty{padding:23px 8px;text-align:center;color:var(--muted);font-size:13px}.balance{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.balance:last-child{border:0}.positive{color:#24734f}.negative{color:var(--red)}.transfer{display:flex;align-items:center;gap:8px;padding:11px;background:#f7faf7;border-radius:12px;margin-top:8px}.transfer .grow{flex:1;min-width:0}.transfer .who{font-size:13px;font-weight:750}.transfer .sub{font-size:11px;color:var(--muted)}.footer-note{font-size:11px;color:var(--muted);line-height:1.55;margin:12px 3px}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.bottomnav-inner{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{border:0;background:transparent;color:var(--muted);font-size:10px;padding:6px 1px;border-radius:11px}.navbtn b{display:block;font-size:18px;margin-bottom:2px}.navbtn.active{background:var(--mint);color:var(--green)}.hidden{display:none!important}.toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#173f35;color:white;border-radius:12px;padding:11px 15px;font-size:13px;z-index:10;box-shadow:var(--shadow);max-width:90vw}.file-label{display:inline-flex;align-items:center;justify-content:center}.danger-zone{border-color:#f0d4cf}.tag{display:inline-block;font-size:10px;padding:4px 7px;background:#edf5ef;color:#38634c;border-radius:7px;white-space:nowrap}.small-actions{display:flex;gap:6px;flex-wrap:wrap}.small-actions button{font-size:12px;padding:7px 9px}.splitline{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0}.hr{height:1px;background:var(--line);margin:10px 0}.notice{background:#fff8e9;border:1px solid #f0dfb8;color:#70531f;border-radius:12px;padding:11px;font-size:12px;line-height:1.5;margin-bottom:12px}.plan-day{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.plan-day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.plan-entry{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.plan-entry-main{flex:1;min-width:0}.plan-entry-title{font-weight:750;font-size:13px}.plan-entry-detail{font-size:11px;color:var(--muted);margin-top:3px}.plan-price{text-align:right;font-size:13px;font-weight:800;white-space:nowrap}.totals{background:#eaf3ed;border-radius:13px;padding:12px}.totals .big{font-size:21px;font-weight:850;color:var(--green)}.preview{max-width:760px;margin:auto;background:#fff;border:1px solid #e1e7e0;border-radius:18px;overflow:hidden}.preview-head{background:var(--green);color:#fff;padding:23px 20px}.preview-head h1{font-size:26px;margin:7px 0}.preview-body{padding:16px}.preview-day{padding:12px 0;border-bottom:1px solid #e6ebe6;break-inside:avoid}.preview-day h3{font-size:15px;margin:0 0 4px}.preview-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:12px;border-bottom:1px dashed #e7ece7}.preview-line:last-child{border-bottom:0}.preview-line .desc{flex:1;min-width:0}.preview-line .price{text-align:right;white-space:nowrap;font-weight:750}.preview-total{background:#edf4ee;border-radius:14px;padding:15px;margin-top:14px}.preview-total .value{font-size:25px;font-weight:850;color:var(--green)}.preview-foot{font-size:10px;color:var(--muted);margin-top:12px;line-height:1.5}.section-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tagline{font-size:11px;letter-spacing:.06em;color:#d9c8a3;font-weight:800}.budgetbar{height:7px;background:#edf1ec;border-radius:9px;overflow:hidden;margin-top:7px}.budgetbar span{display:block;height:100%;background:#4e8769}.checkrow{display:flex;align-items:center;gap:8px;font-size:13px}.scenario-row{display:grid;grid-template-columns:minmax(65px,.8fr) minmax(105px,1fr);gap:5px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.scenario-row:last-child{border-bottom:0}.scenario-base{background:#f4f8f4;margin:0 -8px;padding:12px 8px;border-radius:10px}.scenario-people b,.scenario-price b{display:block;font-size:14px}.scenario-people span,.scenario-price span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.scenario-price{text-align:right}.scenario-price small{font-size:10px;color:var(--muted);font-weight:600}.scenario-change{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:right}.scenario-change.down{color:#24734f;font-weight:750}.scenario-change.up{color:var(--red);font-weight:750}@media(min-width:500px){.scenario-row{grid-template-columns:1fr 1.2fr auto}.scenario-change{grid-column:auto;min-width:120px}}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat-value{font-size:20px}.top{padding-top:27px}.main{padding-top:21px}.shell{padding:0 20px}}
@media print{body{background:white;padding:0}.top,.tabs,.bottomnav,.footer-note,.section-actions,.no-print{display:none!important}.shell{max-width:none;padding:0}.main{padding:0}.preview{border:0;border-radius:0;max-width:none}.preview-head{print-color-adjust:exact;-webkit-print-color-adjust:exact}.preview-total{print-color-adjust:exact;-webkit-print-color-adjust:exact}.preview-day{break-inside:avoid}.preview-line{break-inside:avoid}}
</style></head><body>
<header class="top"><div class="shell"><div class="topline"><div><div class="eyebrow">PLAN · TRACK · SETTLE</div><div class="brand">Trip Money <span style="color:#f2b36d">✳</span></div><p>วางแผนงบ จดเงินจริง เคลียร์ยอดจบในที่เดียว</p></div><div class="top-actions"><button class="iconbtn" id="exportTop" aria-label="สำรองข้อมูล">⇩ สำรอง</button></div></div><div class="tripbar"><select id="tripSelect" aria-label="เลือกทริป"></select><button class="btn btn-orange" id="newTrip">＋ ทริปใหม่</button></div></div></header>
<main class="shell main"><div class="tabs" id="tabs"><button class="tab active" data-page="plan">Plan</button><button class="tab" data-page="preview">นำเสนอ</button><button class="tab" data-page="expenses">Actual</button><button class="tab" data-page="summary">Summary</button><button class="tab" data-page="settings">ตั้งค่า</button></div><div id="app"></div><p class="footer-note">บันทึกอัตโนมัติในเบราว์เซอร์เครื่องนี้ · สำรองข้อมูลเป็น JSON เป็นระยะ · ข้อมูลยังไม่ซิงก์ข้ามเครื่อง</p></main>
<nav class="bottomnav"><div class="bottomnav-inner"><button class="navbtn active" data-page="plan"><b>▤</b>Plan</button><button class="navbtn" data-page="preview"><b>↗</b>นำเสนอ</button><button class="navbtn" data-page="expenses"><b>＋</b>Actual</button><button class="navbtn" data-page="summary"><b>◔</b>Summary</button><button class="navbtn" data-page="settings"><b>☻</b>ตั้งค่า</button></div></nav><div id="toast" class="toast hidden"></div>
<script>
const KEY='trip-money-manager-v2';let state;let page='plan';let editingExpense=null,editingPlan=null;
const starter={activeTrip:'trip-rayong',trips:[{id:'trip-rayong',name:'ระยอง 23–25 ต.ค. 2026',date:'2026-10-23',endDate:'2026-10-25',partySize:6,members:[{id:'oak',name:'โอ๊ก'},{id:'palm',name:'ปาล์ม'},{id:'rock',name:'ร็อค'},{id:'yai',name:'ใหญ่'},{id:'boss',name:'บอส'},{id:'tan',name:'ทัน'}],plans:[],expenses:[]} ]};
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0)}function num(n){return Number(n)||0}function active(){return state.trips.find(t=>t.id===state.activeTrip)||state.trips[0]}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('บันทึกไม่สำเร็จ โปรดสำรองข้อมูล')}}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}function normalize(){state.trips.forEach(t=>{t.members ||= [];t.expenses ||= [];t.plans ||= [];t.partySize=Math.max(1,Number(t.partySize)||t.members.length||1);t.scenarioExtra=Math.max(0,Math.min(20,Math.floor(Number(t.scenarioExtra??2)||0)));t.plans=t.plans.map(p=>({...p,day:Number(p.day)||1,amount:num(p.amount),unit:p.unit==='person'?'person':'group'}))})}function load(){try{let s=localStorage.getItem(KEY);if(!s)s=localStorage.getItem('trip-money-manager-v1');state=s?JSON.parse(s):structuredClone(starter)}catch(e){state=structuredClone(starter)}if(!state.trips?.length)state=structuredClone(starter);if(!state.trips.some(t=>t.id===state.activeTrip))state.activeTrip=state.trips[0].id;normalize();save()}
function setPage(p){page=p;editingPlan=null;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}function memberName(id){return active().members.find(m=>m.id===id)?.name||'สมาชิกที่ถูกลบ'}function planCostAt(p,people){const n=Math.max(1,Math.floor(Number(people)||1));return p.unit==='person'?num(p.amount)*n:num(p.amount)}function planCost(p){return planCostAt(p,active().partySize)}function planPerPerson(p){return active().partySize?planCost(p)/active().partySize:0}function plannedTotalAt(people){return active().plans.reduce((s,p)=>s+planCostAt(p,people),0)}function plannedTotal(){return plannedTotalAt(active().partySize)}function dayTotal(day){return active().plans.filter(p=>Number(p.day)===Number(day)).reduce((s,p)=>s+planCost(p),0)}function scenarioRows(t,extra){const base=Math.max(1,Math.floor(Number(t.partySize)||1)),maxExtra=Math.max(0,Math.min(20,Math.floor(Number(extra)||0)));return Array.from({length:maxExtra+1},(_,i)=>{const people=base+i,total=plannedTotalAt(people),per=total/people;return {people,total,per,delta:i===0?0:per-(plannedTotalAt(base)/base)}})}function scenarioMarkup(t,extra){const rows=scenarioRows(t,extra),base=rows[0]?.per||0;return rows.map((r,i)=>`<div class="scenario-row ${i===0?'scenario-base':''}"><div class="scenario-people"><b>${r.people} คน</b><span>${i===0?'แผนปัจจุบัน':`เพิ่ม ${i} คน`}</span></div><div class="scenario-price"><b>${money(r.per)}<small>/คน</small></b><span>${money(r.total)} ทั้งกลุ่ม</span></div><div class="scenario-change ${i===0?'':r.per<base?'down':r.per>base?'up':'same'}">${i===0?'ฐานเปรียบเทียบ':r.per<base?`ลด ${money(base-r.per)}/คน`:r.per>base?`เพิ่ม ${money(r.per-base)}/คน`:'ราคาเฉลี่ยเท่าเดิม'}</div></div>`).join('')}function days(){return [...new Set(active().plans.map(p=>Number(p.day)||1))].sort((a,b)=>a-b)}function getBalances(){const t=active(),bal=Object.fromEntries(t.members.map(m=>[m.id,0]));for(const e of t.expenses){if(!Object.prototype.hasOwnProperty.call(bal,e.payer))continue;bal[e.payer]+=num(e.amount);const ids=(e.participants||[]).filter(id=>Object.prototype.hasOwnProperty.call(bal,id));if(ids.length){const share=num(e.amount)/ids.length;ids.forEach(id=>bal[id]-=share)}}return bal}function transfers(){const b=getBalances(),debtors=[],creditors=[];Object.entries(b).forEach(([id,v])=>{if(v<-.005)debtors.push({id,amount:-v});else if(v>.005)creditors.push({id,amount:v})});debtors.sort((a,b)=>b.amount-a.amount);creditors.sort((a,b)=>b.amount-a.amount);const out=[];let i=0,j=0;while(i<debtors.length&&j<creditors.length){const amount=Math.min(debtors[i].amount,creditors[j].amount);if(amount>.005)out.push({from:debtors[i].id,to:creditors[j].id,amount});debtors[i].amount-=amount;creditors[j].amount-=amount;if(debtors[i].amount<.005)i++;if(creditors[j].amount<.005)j++}return out}function total(){return active().expenses.reduce((s,e)=>s+num(e.amount),0)}function memberCount(){return active().members.length}function renderTripSelect(){document.getElementById('tripSelect').innerHTML=state.trips.map(t=>`<option value="${esc(t.id)}" ${t.id===state.activeTrip?'selected':''}>${esc(t.name)}</option>`).join('')}
function render(){renderTripSelect();const root=document.getElementById('app');if(!active()){root.innerHTML='<div class="section">ยังไม่มีทริป</div>';return}const t=active();let html='';if(page==='plan')html=planPage(t);if(page==='preview')html=previewPage(t);if(page==='expenses')html=expensesPage(t);if(page==='summary')html=summaryPage(t);if(page==='settings')html=settingsPage(t);root.innerHTML=html;bindPage()}
function planForm(t){const p=editingPlan?t.plans.find(x=>x.id===editingPlan):null;return `<section class="section"><div class="section-head"><h2>${p?'แก้ไขรายการแผน':'＋ เพิ่มรายการในแผน'}</h2><span class="tag">PLANNED</span></div><form id="planForm"><div class="grid2"><div class="field"><label for="planDay">วันที่ของทริป</label><select id="planDay">${Array.from({length:Math.max(3,...t.plans.map(x=>Number(x.day)||1))},(_,i)=>i+1).map(d=>`<option value="${d}" ${Number(p?.day||1)===d?'selected':''}>วันที่ ${d}</option>`).join('')}</select></div><div class="field"><label for="planUnit">รูปแบบราคา</label><select id="planUnit"><option value="person" ${p?.unit!=='group'?'selected':''}>ราคาต่อคน</option><option value="group" ${p?.unit==='group'?'selected':''}>ราคารวมทั้งกลุ่ม</option></select></div></div><div class="field"><label for="planName">ทำอะไร / ไปที่ไหน</label><input id="planName" maxlength="100" required placeholder="เช่น ค่าเข้าอุทยาน, ที่พักริมทะเล, มื้อเย็น" value="${esc(p?.name||'')}"></div><div class="field"><label for="planDetail">รายละเอียดเพิ่มเติม (ไม่บังคับ)</label><input id="planDetail" maxlength="140" placeholder="เช่น กางเต็นท์และทำอาหาร" value="${esc(p?.detail||'')}"></div><div class="grid2"><div class="field"><label for="planAmount">ราคา (บาท)</label><input id="planAmount" type="number" min="0" step="0.01" inputmode="decimal" required placeholder="0" value="${p?num(p.amount):''}"></div><div class="field"><label for="planPeople">จำนวนคนในแผน</label><input id="planPeople" type="number" min="1" step="1" required value="${t.partySize}"></div></div><div class="notice" id="planCalc">${p?`คำนวณเบื้องต้น: ${money(planCost(p))} ทั้งกลุ่ม · ${money(planPerPerson(p))}/คน`:'เลือกรูปแบบราคาและกรอกราคา ระบบจะคำนวณยอดรวมกลุ่มและเฉลี่ยต่อคนให้'}</div><div class="small-actions"><button class="btn btn-primary" type="submit">${p?'บันทึกการแก้ไข':'เพิ่มลงในแผน'}</button>${p?'<button type="button" class="btn btn-light" id="cancelPlanEdit">ยกเลิก</button>':''}</div></form></section>`}
function planPage(t){const total=plannedTotal(),per=t.partySize?total/t.partySize:0;return `<div class="stats"><div class="stat"><div class="stat-label">จำนวนคนในแผน</div><div class="stat-value">${t.partySize} คน</div><div class="stat-note">ปรับจำนวนคนได้</div></div><div class="stat"><div class="stat-label">งบรวมทั้งทริป</div><div class="stat-value">${money(total)}</div><div class="stat-note">รวมรายการ Planned</div></div><div class="stat"><div class="stat-label">เฉลี่ยต่อคน</div><div class="stat-value">${money(per)}</div><div class="stat-note">งบรวม ÷ จำนวนคน</div></div><div class="stat"><div class="stat-label">รายการในแผน</div><div class="stat-value">${t.plans.length}</div><div class="stat-note">ไม่รวม Actual</div></div></div><section class="section"><div class="section-head"><h2>ข้อมูลแผนทริป</h2><span class="tag">แก้ไขได้</span></div><form id="planMetaForm"><div class="field"><label for="planTripName">ชื่อทริป</label><input id="planTripName" required maxlength="90" value="${esc(t.name)}"></div><div class="grid2"><div class="field"><label for="planTripDate">วันเริ่ม</label><input id="planTripDate" type="date" value="${esc(t.date||'')}"></div><div class="field"><label for="planEndDate">วันสิ้นสุด</label><input id="planEndDate" type="date" value="${esc(t.endDate||'')}"></div></div><div class="field"><label for="partySize">จำนวนคนที่จะไป</label><input id="partySize" type="number" min="1" step="1" value="${t.partySize}" required><div class="muted">ใช้คำนวณเฉพาะ Planned ไม่เปลี่ยนรายชื่อหรือค่าใช้จ่ายจริง</div></div><button class="btn btn-primary" type="submit">บันทึกข้อมูลแผน</button></form></section>${planForm(t)}<section class="section"><div class="section-head"><h2>รายการงบประมาณ</h2><span class="tag">${t.plans.length} รายการ</span></div>${planList(t)}<div class="hr"></div><div class="totals"><div class="splitline"><span>งบรวมทั้งทริป</span><b>${money(total)}</b></div><div class="splitline"><span>จำนวนคน</span><b>${t.partySize} คน</b></div><div class="splitline"><span>เฉลี่ยต่อคน</span><b>${money(per)}</b></div><div class="muted">ราคาต่อคนจะคูณจำนวนคน · ราคารวมกลุ่มจะหารจำนวนคนเพื่อแสดงค่าเฉลี่ย</div></div><button class="btn btn-orange" style="width:100%;margin-top:12px" data-go="preview">ดูหน้าเสนอเพื่อน →</button></section><section class="section"><div class="section-head"><h2>ถ้ามีคนไปเพิ่ม งบจะเปลี่ยนแค่ไหน?</h2><span class="tag">ลองจำนวนคน</span></div><p class="muted">คำนวณจากรายการ Planned ทั้งหมด โดยราคาต่อคนจะเพิ่มตามจำนวนคน ส่วนราคารวมกลุ่มคงเดิม แล้วแสดงเฉพาะงบรวมและค่าเฉลี่ยต่อคน ไม่เปลี่ยนแผนหลักหรือ Actual</p><div class="field"><label for="scenarioExtra">อยากลองเพิ่มจากจำนวนคนปัจจุบันอีกกี่คน?</label><input id="scenarioExtra" type="number" min="0" max="20" step="1" value="${Math.max(0,Math.min(20,Math.floor(Number(t.scenarioExtra??2)||0)))}"><div class="muted">เช่น ตอนนี้ 5 คน และใส่ 2 ระบบจะแสดงกรณี 5, 6 และ 7 คน</div></div><div id="scenarioResults">${scenarioMarkup(t,t.scenarioExtra??2)}</div><div class="muted">เป็นการจำลองงบตามรายการที่วางไว้ ไม่ใช่การยืนยันว่าราคาจริงจะลดลงเสมอ</div></section>`}
function planList(t){if(!t.plans.length)return '<div class="empty">ยังไม่มีรายการในแผน เริ่มจากเพิ่มที่พัก อาหาร หรือกิจกรรมได้เลย</div>';return days().map(d=>`<div class="plan-day"><div class="plan-day-head"><div><div class="item-title">วันที่ ${d}</div><div class="item-sub">${t.plans.filter(p=>Number(p.day)===d).length} รายการ</div></div><div class="amount">${money(dayTotal(d))}</div></div>${t.plans.filter(p=>Number(p.day)===d).map(p=>`<div class="plan-entry"><div class="plan-entry-main"><div class="plan-entry-title">${esc(p.name)}</div>${p.detail?`<div class="plan-entry-detail">${esc(p.detail)}</div>`:''}<div class="item-sub">${p.unit==='person'?`${money(p.amount)}/คน × ${t.partySize} คน`:`${money(p.amount)} ทั้งกลุ่ม · หาร ${t.partySize} คน`}</div></div><div><div class="plan-price">${money(planCost(p))}</div><div class="item-sub" style="text-align:right">${money(planPerPerson(p))}/คน</div><div class="small-actions" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-light btn-small" data-edit-plan="${p.id}">แก้</button><button class="btn btn-danger btn-small" data-delete-plan="${p.id}">ลบ</button></div></div></div>`).join('')}</div>`).join('')}
function previewPage(t){const total=plannedTotal(),per=t.partySize?total/t.partySize:0;const dateLabel=t.date?(new Date(t.date+'T12:00:00')).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+(t.endDate?' – '+(new Date(t.endDate+'T12:00:00')).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):''):'ยังไม่กำหนดวัน';return `<div class="section-actions no-print"><button class="btn btn-light" data-go="plan">← กลับไปแก้แผน</button><button class="btn btn-primary" id="printPreview">⇧ พิมพ์ / บันทึก PDF</button><button class="btn btn-orange" id="copyPreview">คัดลอกสรุปเป็นข้อความ</button></div><div class="notice no-print">หน้านี้จัดไว้สำหรับแคปหน้าจอหรือส่งให้เพื่อนโดยเฉพาะ บน iPhone สามารถแคปหน้าจอได้เลย หรือเลือกพิมพ์แล้วบันทึกเป็น PDF</div><article class="preview" id="presentation"><div class="preview-head"><div class="tagline">TRIP PLAN · ESTIMATED BUDGET</div><h1>${esc(t.name)}</h1><div style="font-size:12px;color:#d9e5dd">${esc(dateLabel)} · ${t.partySize} คน</div></div><div class="preview-body">${t.plans.length?days().map(d=>`<section class="preview-day"><h3>DAY ${d} · วันที่ ${d}</h3>${t.plans.filter(p=>Number(p.day)===d).map(p=>`<div class="preview-line"><div class="desc"><b>${esc(p.name)}</b>${p.detail?`<div style="color:#68776f;margin-top:3px">${esc(p.detail)}</div>`:''}<div style="font-size:10px;color:#7a877f;margin-top:3px">${p.unit==='person'?`${money(p.amount)} ต่อคน × ${t.partySize} คน`:`${money(p.amount)} ทั้งกลุ่ม ÷ ${t.partySize} คน`}</div></div><div class="price"><div>${money(planCost(p))}</div><div style="font-size:10px;color:#6d7a74;font-weight:500">${money(planPerPerson(p))}/คน</div></div></div>`).join('')}<div style="display:flex;justify-content:space-between;gap:10px;padding-top:8px;font-size:12px"><span style="color:#68776f">รวมวันที่ ${d}</span><b>${money(dayTotal(d))} · ${money(dayTotal(d)/(t.partySize||1))}/คน</b></div></section>`).join(''):'<div class="empty">ยังไม่มีรายการแผน กลับไปที่ Plan เพื่อเพิ่มกิจกรรมและงบประมาณ</div>'}<div class="preview-total"><div style="font-size:11px;letter-spacing:.07em;color:#64756b;font-weight:800">ESTIMATED TRIP BUDGET</div><div class="value">${money(per)} / คน</div><div style="font-size:13px;margin-top:4px">งบรวมทั้งกลุ่ม ${money(total)} · ${t.partySize} คน</div></div><div class="preview-foot">งบประมาณโดยประมาณ อาจเปลี่ยนแปลงได้ตามการตัดสินใจของกลุ่มและค่าใช้จ่ายจริง</div></div></article>`}
function expenseForm(t){const e=editingExpense?t.expenses.find(x=>x.id===editingExpense):null;const payer=e?.payer||t.members[0]?.id;const participants=e?.participants||t.members.map(m=>m.id);return `<form id="expenseForm"><div class="field"><label for="expName">รายการค่าใช้จ่ายจริง</label><input id="expName" placeholder="เช่น หมูกระทะ, ค่าน้ำมัน, ที่พัก" required maxlength="90" value="${esc(e?.name||'')}"></div><div class="grid2"><div class="field"><label for="expAmount">ยอดจ่ายจริง (บาท)</label><input id="expAmount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required value="${e?num(e.amount):''}"></div><div class="field"><label for="expPayer">ใครเป็นคนจ่าย</label><select id="expPayer" required>${t.members.map(m=>`<option value="${m.id}" ${m.id===payer?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div><div class="field"><label>หารกับใครบ้าง</label><div class="chips">${t.members.map(m=>`<label class="chip"><input type="checkbox" name="participant" value="${m.id}" ${participants.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}</div><div class="muted">Actual เลือกสมาชิกตามที่เกิดขึ้นจริงได้อิสระ ไม่จำเป็นต้องตรงกับ Planned</div></div><div class="small-actions"><button class="btn btn-primary" type="submit">${e?'บันทึกการแก้ไข':'＋ บันทึกรายจ่ายจริง'}</button>${e?'<button type="button" class="btn btn-light" id="cancelEdit">ยกเลิก</button>':''}</div></form>`}
function expenseList(t,limit=0){const arr=[...t.expenses].reverse(),shown=limit?arr.slice(0,limit):arr;if(!shown.length)return '<div class="empty">ยังไม่มีรายจ่ายจริง · เพิ่มรายการที่จ่ายแล้วได้เลย</div>';return shown.map(e=>`<div class="rowitem"><div class="person-dot">${esc((e.name||'?').trim().slice(0,1))}</div><div class="item-main"><div class="item-title">${esc(e.name)}</div><div class="item-sub">จ่ายโดย ${esc(memberName(e.payer))} · หาร ${e.participants.length} คน</div><div class="item-sub">${e.participants.map(memberName).map(esc).join(' · ')}</div></div><div><div class="amount">${money(e.amount)}</div><div class="small-actions" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-light btn-small" data-edit="${e.id}">แก้ไข</button><button class="btn btn-danger btn-small" data-delete="${e.id}">ลบ</button></div></div></div>`).join('')}
function expensesPage(t){return `<div class="notice">ACTUAL · หน้านี้เก็บเฉพาะค่าใช้จ่ายที่เกิดขึ้นจริง ไม่เชื่อมกับรายการ Planned และเพิ่มรายการที่ไม่ได้วางแผนไว้ได้</div><div class="stats"><div class="stat"><div class="stat-label">จ่ายจริงรวม</div><div class="stat-value">${money(total())}</div><div class="stat-note">${t.expenses.length} รายการ</div></div><div class="stat"><div class="stat-label">เฉลี่ยต่อสมาชิก</div><div class="stat-value">${money(memberCount()?total()/memberCount():0)}</div><div class="stat-note">ค่าเฉลี่ยทั้งกลุ่ม</div></div></div><section class="section"><div class="section-head"><h2>${editingExpense?'แก้ไขรายจ่าย':'＋ เพิ่มรายจ่ายจริง'}</h2><span class="tag">ACTUAL</span></div>${expenseForm(t)}</section><section class="section"><div class="section-head"><h2>รายการจริงทั้งหมด</h2><span class="tag">${t.expenses.length} รายการ</span></div>${expenseList(t)}</section>`}
function balanceList(){const b=getBalances();return Object.entries(b).map(([id,v])=>`<div class="balance"><div style="display:flex;align-items:center;gap:10px"><div class="person-dot">${esc(memberName(id).slice(0,1))}</div><div><div class="item-title">${esc(memberName(id))}</div><div class="item-sub">${v>0.005?'มีคนต้องโอนคืน':v<-.005?'ต้องโอนคืนคนอื่น':'ยอดพอดี'}</div></div></div><div class="amount ${v>0.005?'positive':v<-.005?'negative':''}">${v>0.005?'+':''}${money(v)}</div></div>`).join('')}
function summaryPage(t){const trs=transfers(),pt=plannedTotal(),at=total(),delta=at-pt;return `<div class="stats"><div class="stat"><div class="stat-label">งบตามแผน</div><div class="stat-value">${money(pt)}</div><div class="stat-note">Planned · ${t.partySize} คน</div></div><div class="stat"><div class="stat-label">ใช้เงินจริง</div><div class="stat-value">${money(at)}</div><div class="stat-note">Actual · ${t.expenses.length} รายการ</div></div><div class="stat"><div class="stat-label">งบต่อคน</div><div class="stat-value">${money(t.partySize?pt/t.partySize:0)}</div><div class="stat-note">จากแผน</div></div><div class="stat"><div class="stat-label">เงินจริงเฉลี่ยต่อสมาชิก</div><div class="stat-value">${money(memberCount()?at/memberCount():0)}</div><div class="stat-note">ค่าเฉลี่ย ไม่ใช่ยอดหนี้รายบุคคล</div></div></div><section class="section"><div class="section-head"><h2>งบประมาณเทียบกับเงินจริง</h2></div><div class="splitline"><span>Planned</span><b>${money(pt)}</b></div><div class="splitline"><span>Actual</span><b>${money(at)}</b></div><div class="budgetbar"><span style="width:${pt>0?Math.min(100,at/pt*100):at>0?100:0}%"></span></div><div class="splitline"><span>${at>pt?'ใช้เกินงบ':at<pt?'ต่ำกว่างบ':'เท่ากับงบ'}</span><b class="${at>pt?'negative':'positive'}">${money(Math.abs(delta))} ${at>pt?'เกิน':at<pt?'เหลือ':'ต่าง'}</b></div><p class="muted">เปรียบเทียบยอดรวมเท่านั้น ไม่ได้จับคู่หรือเชื่อมรายการแผนกับรายการจริง</p></section><section class="section"><div class="section-head"><h2>ยอดสุทธิจากเงินจริง</h2><span class="tag">${trs.length} รายการโอน</span></div><p class="muted">ยอดบวกคือควรได้รับคืน · ยอดลบคือควรจ่ายเพิ่ม</p>${balanceList()}<div class="hr"></div>${trs.length?trs.map(x=>`<div class="transfer"><div class="grow"><div class="who">${esc(memberName(x.from))} → ${esc(memberName(x.to))}</div><div class="sub">โอนเพื่อเคลียร์ยอดจริง</div></div><div class="amount">${money(x.amount)}</div></div>`).join(''):'<div class="empty">ยังไม่มีรายการโอนที่ต้องเคลียร์ 🎉</div>'}<button class="btn btn-primary" id="copySettlement" style="width:100%;margin-top:12px">คัดลอกสรุปยอดโอน</button></section>`}
function settingsPage(t){return `<section class="section"><div class="section-head"><h2>ข้อมูลทริปและสมาชิก</h2></div><form id="tripForm"><div class="field"><label for="tripName">ชื่อทริป</label><input id="tripName" required maxlength="90" value="${esc(t.name)}"></div><div class="grid2"><div class="field"><label for="tripDate">วันเริ่มทริป</label><input id="tripDate" type="date" value="${esc(t.date||'')}"></div><div class="field"><label for="tripEndDate">วันสิ้นสุด</label><input id="tripEndDate" type="date" value="${esc(t.endDate||'')}"></div></div><button class="btn btn-primary" type="submit">บันทึกข้อมูลทริป</button></form></section><section class="section"><div class="section-head"><h2>สมาชิกในทริป (${t.members.length})</h2></div><form id="memberForm"><div class="field"><label for="memberName">เพิ่มสมาชิก</label><input id="memberName" placeholder="ชื่อเล่น เช่น มิว" maxlength="35" required></div><button class="btn btn-primary" type="submit">＋ เพิ่มสมาชิก</button></form><div class="hr"></div>${t.members.map(m=>`<div class="rowitem"><div class="person-dot">${esc(m.name.slice(0,1))}</div><div class="item-main"><div class="item-title">${esc(m.name)}</div></div><button class="btn btn-danger btn-small" data-remove-member="${m.id}">นำออก</button></div>`).join('')}</section><section class="section"><div class="section-head"><h2>สำรองและย้ายข้อมูล</h2></div><p class="muted">ส่งออกทุกทริป รวมทั้ง Planned และ Actual เป็นไฟล์ JSON เพื่อเก็บสำรอง หรือใช้ไฟล์นำเข้าบนเบราว์เซอร์อีกเครื่อง</p><div class="small-actions"><button class="btn btn-primary" id="exportData">⇩ สำรองข้อมูล</button><label class="btn btn-light file-label">⇧ นำเข้าข้อมูล<input id="importData" type="file" accept="application/json,.json" hidden></label></div></section><section class="section danger-zone"><div class="section-head"><h2>จัดการทริป</h2></div><p class="muted">ลบทริปปัจจุบัน รวม Planned, Actual และสมาชิก</p><button class="btn btn-danger" id="deleteTrip">ลบทริปนี้</button></section>`}
function bindPage(){const scenarioInput=document.getElementById('scenarioExtra');if(scenarioInput){scenarioInput.addEventListener('input',()=>{const t=active(),extra=Math.max(0,Math.min(20,Math.floor(Number(scenarioInput.value)||0)));t.scenarioExtra=extra;const out=document.getElementById('scenarioResults');if(out)out.innerHTML=scenarioMarkup(t,extra);save()})}const pf=document.getElementById('planForm');if(pf){const updateCalc=()=>{const unit=document.getElementById('planUnit').value,amount=num(document.getElementById('planAmount').value),people=Math.max(1,num(document.getElementById('planPeople').value)),cost=unit==='person'?amount*people:amount,per=cost/people;document.getElementById('planCalc').textContent=`งบรวม ${money(cost)} ทั้งกลุ่ม · เฉลี่ย ${money(per)}/คน`};['planUnit','planAmount','planPeople'].forEach(id=>document.getElementById(id).addEventListener('input',updateCalc));pf.onsubmit=e=>{e.preventDefault();const t=active(),people=Math.max(1,Math.floor(num(document.getElementById('planPeople').value)));t.partySize=people;const data={id:editingPlan||uid(),day:Math.max(1,Math.floor(num(document.getElementById('planDay').value))),unit:document.getElementById('planUnit').value==='person'?'person':'group',name:document.getElementById('planName').value.trim(),detail:document.getElementById('planDetail').value.trim(),amount:num(document.getElementById('planAmount').value)};if(!data.name||data.amount<0){toast('กรอกชื่อรายการและราคาให้ถูกต้อง');return}const ix=t.plans.findIndex(x=>x.id===editingPlan);if(ix>=0)t.plans[ix]=data;else t.plans.push(data);editingPlan=null;save();render();toast('บันทึกรายการแผนแล้ว')}}const pm=document.getElementById('planMetaForm');if(pm)pm.onsubmit=e=>{e.preventDefault();const t=active();t.name=document.getElementById('planTripName').value.trim();t.date=document.getElementById('planTripDate').value;t.endDate=document.getElementById('planEndDate').value;t.partySize=Math.max(1,Math.floor(num(document.getElementById('partySize').value)));save();render();toast('บันทึกข้อมูลแผนแล้ว')};const cpe=document.getElementById('cancelPlanEdit');if(cpe)cpe.onclick=()=>{editingPlan=null;render()};document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>{editingPlan=b.dataset.editPlan;render();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-delete-plan]').forEach(b=>b.onclick=()=>{if(confirm('ลบรายการนี้ออกจากแผนใช่ไหม?')){active().plans=active().plans.filter(p=>p.id!==b.dataset.deletePlan);save();render();toast('ลบรายการแผนแล้ว')}});const ef=document.getElementById('expenseForm');if(ef)ef.onsubmit=e=>{e.preventDefault();const t=active(),name=document.getElementById('expName').value.trim(),amount=num(document.getElementById('expAmount').value),payer=document.getElementById('expPayer').value,participants=[...ef.querySelectorAll('input[name="participant"]:checked')].map(x=>x.value);if(!name||amount<=0||!participants.length){toast('กรอกข้อมูลและเลือกคนหารอย่างน้อย 1 คน');return}if(!t.members.some(m=>m.id===payer)){toast('เลือกผู้จ่ายใหม่');return}const data={id:editingExpense||uid(),name,amount,payer,participants};const ix=t.expenses.findIndex(x=>x.id===editingExpense);if(ix>=0)t.expenses[ix]=data;else t.expenses.push(data);editingExpense=null;save();render();toast('บันทึกรายจ่ายจริงแล้ว')};const ce=document.getElementById('cancelEdit');if(ce)ce.onclick=()=>{editingExpense=null;render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingExpense=b.dataset.edit;setPage('expenses');window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('ลบรายการค่าใช้จ่ายนี้ใช่ไหม?')){active().expenses=active().expenses.filter(e=>e.id!==b.dataset.delete);save();render();toast('ลบรายการแล้ว')}});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));const tf=document.getElementById('tripForm');if(tf)tf.onsubmit=e=>{e.preventDefault();const t=active();t.name=document.getElementById('tripName').value.trim();t.date=document.getElementById('tripDate').value;t.endDate=document.getElementById('tripEndDate').value;save();render();toast('บันทึกข้อมูลทริปแล้ว')};const mf=document.getElementById('memberForm');if(mf)mf.onsubmit=e=>{e.preventDefault();const name=document.getElementById('memberName').value.trim();if(!name)return;if(active().members.some(m=>m.name.toLowerCase()===name.toLowerCase())){toast('มีชื่อนี้ในทริปแล้ว');return}active().members.push({id:uid(),name});save();render();toast('เพิ่มสมาชิกแล้ว')};document.querySelectorAll('[data-remove-member]').forEach(b=>b.onclick=()=>{const id=b.dataset.removeMember;if(active().expenses.some(e=>e.payer===id||(e.participants||[]).includes(id))){toast('สมาชิกนี้อยู่ในรายการเงินจริง กรุณาแก้หรือลบรายการก่อน');return}if(confirm('นำสมาชิกนี้ออกจากทริปใช่ไหม?')){active().members=active().members.filter(m=>m.id!==id);save();render()}});const cp=document.getElementById('copySettlement');if(cp)cp.onclick=()=>{const t=active(),trs=transfers(),txt=[`สรุปค่าใช้จ่ายจริง: ${t.name}`,`ค่าใช้จ่ายจริงรวม ${money(total())}`,'',...trs.map(x=>`${memberName(x.from)} โอนให้ ${memberName(x.to)} ${money(x.amount)}`),'','ยอดสุทธิสมาชิก:',...Object.entries(getBalances()).map(([id,v])=>`${memberName(id)}: ${v>0?'+':''}${money(v)}`)].join('\n');copyText(txt)};const print=document.getElementById('printPreview');if(print)print.onclick=()=>window.print();const copy=document.getElementById('copyPreview');if(copy)copy.onclick=()=>{const t=active(),txt=[t.name,`${t.date||'ยังไม่กำหนดวัน'}${t.endDate?' ถึง '+t.endDate:''} · ${t.partySize} คน`,'',...days().flatMap(d=>[`วันที่ ${d}`,...t.plans.filter(p=>Number(p.day)===d).map(p=>`- ${p.name}${p.detail?' — '+p.detail:''}: ${money(planCost(p))} ทั้งกลุ่ม (${money(planPerPerson(p))}/คน)`),`รวมวันที่ ${d}: ${money(dayTotal(d))}`]),'',`งบรวมทั้งกลุ่ม ${money(plannedTotal())}`,`เฉลี่ย ${money(t.partySize?plannedTotal()/t.partySize:0)} ต่อคน`,'งบประมาณโดยประมาณ อาจเปลี่ยนแปลงได้'].join('\n');copyText(txt)};const ex=document.getElementById('exportData');if(ex)ex.onclick=exportData;const im=document.getElementById('importData');if(im)im.onchange=importData;const del=document.getElementById('deleteTrip');if(del)del.onclick=()=>{if(!confirm(`ลบทริป “${active().name}” และข้อมูลทั้งหมดใช่ไหม?`))return;state.trips=state.trips.filter(t=>t.id!==state.activeTrip);if(!state.trips.length){const nt=structuredClone(starter.trips[0]);nt.id=uid();nt.name='ทริปใหม่';nt.members=[];nt.plans=[];nt.expenses=[];state.trips=[nt]}state.activeTrip=state.trips[0].id;save();editingExpense=null;editingPlan=null;render();toast('ลบทริปแล้ว')}}
function copyText(txt){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกแล้ว')).catch(()=>fallbackCopy(txt));else fallbackCopy(txt)}function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('คัดลอกแล้ว')}catch(e){alert(txt)}ta.remove()}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trip-money-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('สร้างไฟล์สำรองแล้ว')}function importData(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.trips)||!s.trips.length)throw Error();if(!confirm('การนำเข้าจะแทนที่ข้อมูลในเบราว์เซอร์นี้ ต้องการดำเนินการต่อไหม?'))return;state=s;if(!state.trips.some(t=>t.id===state.activeTrip))state.activeTrip=state.trips[0].id;normalize();save();render();toast('นำเข้าข้อมูลแล้ว')}catch(e){alert('ไฟล์ไม่ถูกต้อง หรือไม่ใช่ไฟล์สำรองจาก Trip Money Manager')}ev.target.value=''};r.readAsText(f)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('tripSelect').addEventListener('change',e=>{state.activeTrip=e.target.value;editingExpense=null;editingPlan=null;save();render()});document.getElementById('newTrip').onclick=()=>{const name=prompt('ตั้งชื่อทริปใหม่ เช่น เขาใหญ่ ธ.ค. 2026');if(!name||!name.trim())return;const base=active();const t={id:uid(),name:name.trim(),date:'',endDate:'',partySize:base.partySize||base.members.length||1,members:base.members.map(m=>({id:uid(),name:m.name})),plans:[],expenses:[]};state.trips.push(t);state.activeTrip=t.id;editingExpense=null;editingPlan=null;save();setPage('plan');toast('สร้างทริปใหม่แล้ว')};document.getElementById('exportTop').onclick=exportData;load();render();
</script></body></html>
